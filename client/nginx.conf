server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets are safe to cache forever; index.html must always revalidate so
    # a new deploy is picked up on next load instead of being served from a stale cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API proxy for the docker-compose stack, mirroring the Vite dev proxy
    # (vite.config.ts) so the client can call same-origin `/api/v1/...` without
    # VITE_API_BASE_URL set. Resolves via Docker's internal DNS; harmless if nothing
    # listens at that name (Render's static site build does not use this file at all).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream "api:8000";
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing (wouter): unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
