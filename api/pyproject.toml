[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pika-api"
version = "0.1.0"
description = "Policy-aligned FastAPI service for Pika’s authorized community intelligence workflows."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<6.0",
  "cryptography>=43.0,<44.0",
  "argon2-cffi>=23.1,<24.0",
  "celery>=5.4,<6.0",
  "email-validator>=2.2,<3.0",
  "discord.py>=2.4,<3.0",
  "scalar-fastapi>=1.8,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "B008",   # FastAPI's Depends()-in-default-argument is the framework's idiomatic DI pattern.
  "BLE001", # Health checks and best-effort background handlers intentionally catch broadly.
]
